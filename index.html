['Frame the mandate','Agree the business problem, outcomes, in-scope products and data, sponsors, boundary, exclusions and measures of success. Write assumptions separately from facts.'],

function dataLinks(){return `<div class="actions">${csvLink('data_assets.csv','Assets CSV')}${csvLink('ai_use_cases.csv','AI register CSV')}${csvLink('control_library.csv','Controls CSV')}</div>`}
function render(){document.getElementById('crumb').textContent=({overview:'Overview',catalog:'Data catalogue',glossary:'Business glossary',ai:'AI use cases',controls:'Policies & controls',quality:'Quality & lineage',playbook:'Project playbook'})[page];document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));app.innerHTML=({overview:overviewPage,catalog:catalogPage,glossary:glossaryPage,ai:aiPage,controls:controlsPage,quality:qualityPage,playbook:playbookPage})[page]();wire()}
function overviewPage(){return `${pageHead('Governance workspace','A trusted map of data and AI','An Alation-inspired catalogue experience for a synthetic UK retail bank.',dataLinks())}<div class="hero"><div><div class="eyebrow">Illustrative client case · synthetic records only</div><h2>Make trusted data discoverable. Make AI use accountable.</h2><p>Northstar Retail Bank is a fictional portfolio scenario. The proposed programme joins business definitions, data ownership, quality and lineage with an AI inventory, lifecycle gates and customer-outcome monitoring.</p></div><span class="badge">Portfolio demonstrator</span></div><div class="grid stats">${stat('Catalogue assets','10','Core datasets, domains and governance records')}${stat('Business terms','7','Owned definitions with linked assets')}${stat('AI use cases','2','One bounded GenAI pilot; one pre-production model')}${stat('Governance controls','10','Ownership, privacy, quality, AI and outcomes')}</div><div class="grid two"><section class="card"><h2>Project problem statement</h2><p class="sub">Interview-ready, fictional and based on common governance challenges</p><p>A UK retail bank wants to improve the reliability and explainability of customer-outcome reporting while enabling carefully controlled AI use. Data is spread across operational platforms and analytics products; terms and ownership are inconsistently understood; quality issues can be difficult to trace to source; and AI proposals arrive through different business routes without one joined-up inventory. These gaps make it harder to find trusted data, evidence how measures are produced, assess privacy and model risks, and demonstrate effective human oversight.</p><div class="callout"><strong>Target outcome:</strong> a governed catalogue and operating model that helps teams discover approved data, understand its meaning and lineage, resolve quality issues, and move AI use cases through proportionate assessment, approval and monitoring.</div><p class="sub">This is an invented scenario. It does not describe or claim facts about any named bank, vendor or actual implementation.</p></section><section class="card"><h2>Delivery pulse</h2><p class="sub">Example baseline for demonstrating the workflow; replace with measured evidence in a real engagement.</p><div class="list"><div class="progressrow"><span>Priority asset profiles completed</span><b>8 / 10</b></div><div class="progress"><i style="width:80%"></i></div><div class="progressrow"><span>Named owner and steward</span><b>9 / 10</b></div><div class="progress"><i style="width:90%"></i></div><div class="progressrow"><span>AI release evidence complete</span><b>1 / 2</b></div><div class="progress"><i style="width:50%;background:#d29a35"></i></div><div class="rowitem"><div><strong>Key release dependency</strong><small>AI-002: close feature-lineage and independent-validation actions</small></div>${badge('Open','warn')}</div></div></section></div><div class="grid two" style="margin-top:15px"><section class="card"><h2>Find trusted data</h2><p class="sub">Search this working catalogue by name, owner, definition, tag or term.</p><div class="toolbar"><input class="search" id="quickSearch" placeholder="Try: complaint, fraud, Consumer Duty…"><button class="btn primary" id="openSearch">Search catalogue</button></div><div class="list"><div class="rowitem"><div><strong>Customer outcome measures</strong><small>D-007 · owner: Customer Outcomes Office · Confidential</small></div>${badge('In review','warn')}</div><div class="rowitem"><div><strong>Fraud alert features</strong><small>D-006 · owner: Financial Crime Analytics · Restricted</small></div>${badge('Remediation','risk')}</div></div></section><section class="card"><h2>Featured AI use case</h2><p class="sub">AI-001 · Support knowledge assistant</p><p>Retrieval over approved internal procedures drafts an answer for an agent. The agent checks and edits every response. Pilot scope excludes autonomous customer communication.</p><div class="actions"><span class="pill green">Human check required</span><span class="pill">Bounded pilot</span><span class="pill orange">Monthly review</span></div></section></div><div class="footerline">Prototype only. No connection to Alation, a bank system, live data or AI model. Sample status values are scenario inputs.</div>`}
function catalogPage(){let rows=assets.map(a=>`<tr><td><span class="assetname">${a.name}</span><div class="muted mono">${a.id} · ${a.type}</div></td><td>${a.description}</td><td>${a.owner}<div class="muted">Steward: ${a.steward}</div></td><td>${a.class}</td><td>${a.system}</td><td><div class="progress"><i style="width:${a.quality}%"></i></div><small>${a.quality}% illustrative</small></td><td>${a.status==='Certified'?'<span class="pill green">Certified</span>':a.status==='Remediation'?'<span class="pill red">Remediation</span>':'<span class="pill orange">'+a.status+'</span>'}</td><td>${a.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</td></tr>`).join('');return `${pageHead('Discover','Data catalogue','Searchable inventory with owner, steward, classification, quality, tags and lineage.',csvLink('data_assets.csv','Download catalogue'))}<div class="card"><div class="toolbar"><input class="search" id="assetSearch" placeholder="Search name, owner, description, tag or system…"><select class="filter" id="assetClass"><option value="">All classifications</option><option>Internal</option><option>Confidential</option><option>Restricted</option></select></div><div id="assetTable">${table(['Asset / type','Description','Owner / steward','Classification','Source','Quality profile','Status','Tags'],rows)}</div><p class="footerline">Quality scores and certification labels are invented demonstrator values, not measured service levels. Confirm field-level classification, lawful basis and access rules with accountable teams.</p></div>`}
function glossaryPage(){let rows=glossary.map(t=>`<tr><td class="glossary-term">${t.term}</td><td>${t.definition}</td><td>${t.owner}</td><td>${t.synonyms}</td><td><span class="pill green">${t.status}</span></td><td class="mono">${t.linked}</td></tr>`).join('');return `${pageHead('Shared language','Business glossary','Definitions owned by business domains and connected to data assets.',csvLink('business_glossary.csv','Download glossary'))}<div class="card"><div class="toolbar"><input class="search" id="termSearch" placeholder="Search terms, meaning, synonyms or owner…"></div><div id="glossaryTable">${table(['Term','Approved meaning','Business owner','Synonyms','Status','Linked assets'],rows)}</div><div class="callout"><strong>Stewardship pattern:</strong> submit proposed term → domain steward checks meaning and synonyms → accountable owner approves → link to datasets, reports, controls and AI use cases → review on material change.</div></div>`}
function aiPage(){let rows=aiCases.map(c=>`<tr><td><span class="assetname">${c.name}</span><div class="muted mono">${c.id} · ${c.tech}</div></td><td>${c.purpose}</td><td>${c.owner}</td><td><span class="pill ${c.impact==='High'?'orange':''}">${c.impact}</span></td><td>${c.stage}</td><td>${c.human}</td><td>${c.decision}</td></tr>`).join('');return `${pageHead('Responsible enablement','AI use-case inventory','A single intake and lifecycle view for AI, analytics and third-party systems.',csvLink('ai_use_cases.csv','Download AI register'))}<div class="callout"><strong>Gate principle:</strong> intake before procurement, pilot or material change. Scope the actual purpose and affected people; route to privacy, security, model-risk, conduct and supplier review as appropriate. An inventory entry is not approval.</div><div class="card"><div class="toolbar"><input class="search" id="aiSearch" placeholder="Search use case, purpose, owner, risk or control…"><span class="pill">2 illustrative records</span></div><div id="aiTable">${table(['System / type','Purpose','Business owner','Impact tier*','Lifecycle','Human oversight','Current gate'],rows)}</div><p class="footerline">*Impact tiers are proposed internal triage labels for this scenario, not a UK statutory AI classification. The right assessment depends on actual use, law, regulator expectations and firm policy.</p></div><div class="grid two" style="margin-top:15px"><div class="card"><h2>Lifecycle gates</h2><div class="list">${[['01 Intake','Register purpose, owner, users, affected groups, model/provider and data.'],['02 Assess','Privacy/DPIA screening, security, model risk, conduct, consumer outcomes, supplier and legal review.'],['03 Approve','Named decision-maker accepts residual risk; conditions, prohibited uses and release criteria recorded.'],['04 Operate','Versioned release, monitoring, human fallback, incident route, user training and periodic review.'],['05 Change or retire','Reassess material changes; revoke access, archive evidence and safely retire the system.']].map(x=>`<div class="rowitem"><div><strong>${x[0]}</strong><small>${x[1]}</small></div></div>`).join('')}</div></div><div class="card"><h2>AI enablement guardrails</h2><div class="list"><div class="rowitem"><div><strong>GenAI boundary</strong><small>Approved corpus, access controls, output citations, leakage testing, agent verification and no autonomous external send in pilot.</small></div></div><div class="rowitem"><div><strong>Decision impact</strong><small>Document whether output informs a significant decision; assess legal safeguards and meaningful human involvement with counsel.</small></div></div><div class="rowitem"><div><strong>Model/data link</strong><small>Version every model and data input; record provenance, permitted purpose, known limitations and change history.</small></div></div><div class="rowitem"><div><strong>Outcome monitoring</strong><small>Track service quality, errors, overrides, complaints and appropriately designed group analyses where lawful and meaningful.</small></div></div></div></div></div>`}
function controlsPage(){let rows=controls.map(c=>`<tr><td class="mono">${c.id}</td><td><span class="assetname">${c.name}</span><div class="muted">${c.purpose}</div></td><td>${c.owner}</td><td>${c.cadence}</td><td>${c.evidence}</td><td><span class="pill ${c.status==='Operating'?'green':c.status.includes('Required')?'orange':''}">${c.status}</span></td></tr>`).join('');return `${pageHead('Operating model','Policies & controls','A practical control library with accountable owners, evidence and review cadence.',csvLink('control_library.csv','Download control library'))}<div class="grid three" style="margin-bottom:15px"><div class="card"><h2>Policy stack</h2><p class="sub">Set enterprise policy, standards, procedures and evidence expectations.</p><div class="list">${['Data Governance Policy','Data Classification & Handling Standard','Data Quality Standard','Metadata & Lineage Standard','AI Governance Policy','Model Risk Management Standard','Privacy & DPIA Procedure','Third-Party Risk Standard','AI Incident & Change Procedure'].map((x,i)=>`<div class="rowitem"><div><strong>${x}</strong><small>Policy artefact ${String(i+1).padStart(2,'0')} · draft for scenario</small></div><span class="pill">Draft</span></div>`).join('')}</div></div><div class="card" style="grid-column:span 2"><h2>Control library</h2><p class="sub">Translate policy statements into testable activities and auditable evidence.</p>${table(['ID','Control objective','Accountable owner','Cadence','Example evidence','Scenario status'],rows)}<div class="callout caution"><strong>Applicability check:</strong> FCA Consumer Duty rules and PRA model-risk expectations apply within their defined scope. A real firm should map each control to its legal entity, permissions, products, systems and current policy inventory.</div></div></div><div class="card"><h2>Decision forums and escalation</h2><div class="grid three"><div><span class="pill">Data Governance Council</span><p class="sub">Approves standards, resolves cross-domain ownership, prioritises remediation and reviews adoption measures.</p></div><div><span class="pill">AI & Model Risk Committee</span><p class="sub">Reviews higher-impact use cases, challenge outcomes, release conditions, exceptions and material changes.</p></div><div><span class="pill">Product / Customer Outcomes Forum</span><p class="sub">Reviews outcomes evidence, root causes, customer impact, corrective actions and MI limitations.</p></div></div><p class="footerline">Illustrative forum names and reporting lines; align to the real organisation's existing committee and Senior Management Function framework.</p></div>`}
function qualityPage(){let rows=rules.map(r=>`<tr><td class="mono">${r.id}</td><td>${r.asset}<div class="muted mono">${r.element}</div></td><td>${r.rule}</td><td>${r.threshold}</td><td><span class="pill ${r.severity==='Critical'?'red':'orange'}">${r.severity}</span></td><td>${r.owner}</td><td>${r.example}</td></tr>`).join('');return `${pageHead('Trust and traceability','Quality & lineage','Quality expectations, issues and provenance for priority data and AI inputs.',csvLink('data_quality_rules.csv','Download DQ rules'))}<div class="grid two"><div class="card"><h2>Sample lineage: customer outcomes</h2><p class="sub">Logical lineage; no live connector or physical schema is represented.</p><div class="lineage"><span class="node">Core banking<br><small>D-001, D-002</small></span><span class="arrow">→</span><span class="node">CRM + complaints<br><small>D-003, D-004</small></span><span class="arrow">→</span><span class="node">Curated domain products</span><span class="arrow">→</span><span class="node">Outcomes mart<br><small>D-007</small></span><span class="arrow">→</span><span class="node">Board MI / outcomes review</span></div><div class="callout">At implementation, capture transformations, filters, refresh schedule, aggregation, exclusions, report consumers and accountable approver. Distinguish technical lineage from business interpretation.</div></div><div class="card"><h2>Sample lineage: fraud AI</h2><p class="sub">Shows how input assets and a decision record connect.</p><div class="lineage"><span class="node">Payments<br><small>D-005</small></span><span class="arrow">→</span><span class="node">Curated transactions</span><span class="arrow">→</span><span class="node">Feature store<br><small>D-006</small></span><span class="arrow">→</span><span class="node">AI-002<br>Alert priority</span><span class="arrow">→</span><span class="node">Analyst disposition<br><small>D-010 log</small></span></div><div class="callout caution">AI-002 is held at pre-production in the scenario until lineage gaps and independent validation evidence close.</div></div></div><div class="card" style="margin-top:15px"><h2>Critical data quality rules</h2><p class="sub">Rules include measurable thresholds, severity, accountable owner and failure handling.</p>${table(['Rule','Asset / element','Rule definition','Target','Severity','Owner','Failure handling'],rows)}</div><div class="grid three" style="margin-top:15px"><div class="card"><h2>Issue workflow</h2><p class="sub">Detect → log → triage severity → assign owner → root cause → remediate → evidence → validate closure → trend.</p></div><div class="card"><h2>Quality dimensions</h2><p class="sub">Completeness, validity, uniqueness, consistency, timeliness and accuracy. Define which dimension fits each element.</p></div><div class="card"><h2>Threshold governance</h2><p class="sub">Thresholds are risk-based, approved, evidenced and reviewed. A score alone does not prove the data is fit for purpose.</p></div></div>`}
function playbookPage(){return `${pageHead('A–Z delivery guide','Project playbook','A step-by-step approach from mandate through steady-state governance.',`<a class="btn" href="Project-Guide.md" target="_blank">Open full guide</a><a class="btn" href="Interview-Story.md" target="_blank">Interview story</a>`)}<div class="grid two"><div class="card"><h2>Implementation sequence</h2><p class="sub">Use this as the delivery plan; agree scope and evidence with the actual client.</p>${steps.map((s,i)=>`<div class="step"><span class="num">${String(i+1).padStart(2,'0')}</span><div><h3>${s[0]}</h3><p>${s[1]}</p></div></div>`).join('')}</div><div><div class="card"><h2>Start here</h2><p class="sub">A suggested first 30 days for a governance lead</p><div class="list">${[['Week 1','Sponsor interviews, mandate, use-case scope and stakeholder map'],['Week 2','Data and AI inventory, current-state evidence, risk and pain-point baseline'],['Week 3','Decision rights, priority domains, minimum metadata and AI intake'],['Week 4','Pilot catalogue records, critical data rules, issue workflow and committee pack']].map(x=>`<div class="rowitem"><div><strong>${x[0]}</strong><small>${x[1]}</small></div></div>`).join('')}</div><div class="callout"><strong>First measurable win:</strong> pick a report that matters, trace its critical measures to owned source data, make definitions visible, and resolve one demonstrable quality issue end to end.</div></div><div class="card" style="margin-top:15px"><h2>Artefacts in this pack</h2><div class="list">${[['Project-Guide.md','Full scope, delivery method, roles, measures, risks and source notes'],['Interview-Story.md','Concise STAR-style presentation and interview prompts'],['data_assets.csv','Synthetic catalogue starter records'],['business_glossary.csv','Owned business definitions'],['ai_use_cases.csv','Illustrative AI inventory'],['control_library.csv','Control objectives, ownership and evidence'],['data_quality_rules.csv','Rule definitions and issue handling'],['sources.md','Primary references and how they inform the design']].map(x=>`<div class="rowitem"><div><strong><a class="src" href="${x[0]}" target="_blank">${x[0]}</a></strong><small>${x[1]}</small></div></div>`).join('')}</div></div></div></div><div class="footerline">Run locally: open index.html in a current browser. No server or package installation required. CSV files contain synthetic examples only.</div>`}
function wire(){document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>{page=b.dataset.page;document.querySelectorAll('#nav button').forEach(x=>x.classList.toggle('active',x===b));render()});const search=(id,body,query,filter)=>{const el=document.getElementById(id);if(el)el.addEventListener('input',()=>{const q=el.value.toLowerCase();document.querySelectorAll(body+' tbody tr').forEach(tr=>{const ok=tr.innerText.toLowerCase().includes(q)&&(!filter||filter(tr));tr.style.display=ok?'':'none'})})};search('assetSearch','#assetTable');const cl=document.getElementById('assetClass');if(cl)cl.onchange=()=>document.querySelectorAll('#assetTable tbody tr').forEach(tr=>tr.style.display=(!cl.value||tr.children[3].innerText===cl.value)?'':'none');search('termSearch','#glossaryTable');search('aiSearch','#aiTable');const qs=document.getElementById('quickSearch');if(qs)qs.onkeydown=e=>{if(e.key==='Enter'){page='catalog';render();const s=document.getElementById('assetSearch');s.value=qs.value;s.dispatchEvent(new Event('input'))}};const go=document.getElementById('openSearch');if(go)go.onclick=()=>{page='catalog';render();const s=document.getElementById('assetSearch');s.value=document.getElementById('quickSearch').value;s.dispatchEvent(new Event('input'))}}
render();
</script></body></html>
